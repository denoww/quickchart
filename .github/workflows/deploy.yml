name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      label:
        description: Deploy
        required: false
        default: Deploy

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload docker-compose.yml para S3
        run: aws s3 cp docker-compose.yml s3://sc-environments/quickchart/docker-compose.yml --acl private

  deploy:
    needs: prepare
    uses: denoww/github_actions/.github/workflows/rodar_docker_compose_no_ec2.yml@main
    with:
      ec2_com_tag: quickchart
      workdir: /opt/quickchart
      s3_compose_uri: s3://sc-environments/quickchart/docker-compose.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ☠️ AQUI VIVIA `ligar_load_balancer`, REMOVIDO EM 24/11/2026. Não recrie.
  #
  # Ele rodava a cada push na main e (re)criava o listener HTTPS :3008 no ALB PÚBLICO
  # seucondominio-web apontando para o QuickChart. Foi exatamente por esse listener
  # (app.seucondominio.com.br:3008/chart) que entrou o ataque de 15–17/10/2026: RCE pelo
  # `new Function` da config → IMDS → role MultiServiceEC2 → .env do S3. O listener foi removido
  # à mão em 20–21/10; com este job aqui, o próximo merge o recriaria.
  #
  # O QuickChart é serviço INTERNO: só o ERP o chama, por IP privado na VPC (SG do box). Se um
  # dia precisar de TLS ou nome, use um ALB/NLB INTERNO (scheme internal), nunca o público.
